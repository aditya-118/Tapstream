# Single-node Kafka in KRaft mode: one process is both broker and controller,
# so there is no Zookeeper. Development only - a real cluster needs 3 controllers
# and replication factors above 1.
services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: tapstream-kafka
    ports:
      - "9092:9092"
    environment:
      # Fixed so the storage volume survives recreation of the container.
      CLUSTER_ID: tapstream-dev-cluster-01

      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # What clients are told to connect to. The host reaches the broker on
      # localhost:9092 via the port mapping above.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      # Single node: nothing to replicate to.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Do not wait 3s for other consumers before rebalancing a group.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by `make topics`, with the partition
      # count we want. Auto-creation would silently make them 1-partition.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # Must be set explicitly. This image defaults to /tmp/kafka-logs, which
      # lives in the container's writable layer and is lost on recreate.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s

volumes:
  kafka-data:
