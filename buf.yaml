version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # These require every RPC to own <Method>Request/<Method>Response types.
    # Worth it when messages evolve per method, but for a server-streaming RPC
    # the response is a stream element, and DashboardUpdate names what it is
    # better than SubscribeUpdatesResponse would.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
